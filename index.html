<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kniting for You</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="container">
        <span class="knite">
            <img src="images/knitting.svg" alt="" class="menu-icon">
            Клубочек для души
        </span>
        <nav>
            <ul>
                <li class="active"><a href="#">
                    Главная
                    <img src="images/home.svg" alt="" class="menu-icon">
                </a></li>
                <li><a href="#">
                    Каталог
                    <img src="images/loupe.svg" alt="" class="menu-icon">
                </a></li>
                <li><a href="#">
                    Понравившиеся
                    <img src="images/love.svg" alt="" class="menu-icon">
                </a></li>
                <li><a href="#">
                    Мой аккаунт
                    <img src="images/account.svg" alt="" class="menu-icon">
                </a></li>
            </ul>
        </nav>
    </header>

    <div class="photo">
        <img src="images/first_photo.jpg" alt="">
    </div>

    <section class="popular_cards">

        <h2 class="popular_title">Популярные работы</h2>
        <p class="popular_subtitle">
            Свитеры, игрушки, пледы и многое другое — найдите своё вдохновение
        </p>

        <div class="cards">
            <a href="#" class="card">
                <div class="card_img">
                    <img src="images/card1.jpg" alt="">
                </div>
                <h3 class="card_title">Сумка</h3>
            </a>

            <a href="#" class="card">
                <div class="card_img">
                    <img src="images/card2.jpg" alt="">
                </div>
                <h3 class="card_title">Капибара</h3>
            </a>

            <a href="#" class="card">
                <div class="card_img">
                    <img src="images/card3.jpg" alt="">
                </div>
                <h3 class="card_title">Свитер</h3>
            </a>
        </div>
    </section>



</body>
</html>
